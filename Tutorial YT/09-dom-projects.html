<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dom</title>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="Subscribe()" class="js-subscribe-button">Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input class="js-cost-input" placeholder="Cost of order" onkeydown="handleCostKeydown(event)">
    <button onclick="CalculateShipping()"
    
    >Calculate</button>
    <p class="js-total-cost"></p>
    <script>
       console.log(window.document)
       function Subscribe()
       {
            const buttonElement = document.querySelector('.js-subscribe-button')
            if(buttonElement.innerText === 'Subscribe')
            {
                buttonElement.innerText = 'Subscribed'
            }
            else
            {
                buttonElement.innerText = 'Subscribe'
            }
       }
       function handleCostKeydown(event)
       {
            if(event.key === 'Enter')
            {
                CalculateShipping();
            }
       }
       function CalculateShipping()
       {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            cost = cost < 40 ? cost + 10 : cost;
            document.querySelector('.js-total-cost').innerHTML = cost;
       }
    
    </script>
</body>
</html>
