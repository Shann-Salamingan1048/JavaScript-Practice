<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Loops Projects</title>

</head>
<body>
    <script>
        const todoList = [
            'make dinner',
            'wash dishes',
            'watch youtube'

        ];
        for(let i = 0; i < todoList.length; ++i)
            console.log(todoList[i])
    </script>    
</body>
</html>
