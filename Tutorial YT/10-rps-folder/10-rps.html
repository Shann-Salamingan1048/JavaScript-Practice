<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Rock Paper Scissors Function</title>
    <link rel="stylesheet" href="10-rps.css">

</head>
<body>
<p class="title-p">Rock Paper Scissors</p>
<button onclick="validateWinner('rock')" class="move-button"><img src="images/rock-emoji.png"
    class="move-icon">
    
</button>
<button onclick="validateWinner('paper')" class="move-button"> <img src="images/paper-emoji.png"
    class="move-icon">
    
</button>

<button onclick="validateWinner('scissors')" class="move-button"> <img src="images/scissors-emoji.png"
    class="move-icon">
    
</button>
<p class="js-result result-p">
</p>
<p class="js-moves">
</p>
<p class="js-score score-p">
</p>
<button onclick="resetScores()" class="reset-btn">
    Reset Score
</button>
<script src="10-rps.js"></script>
</body>
</html>
