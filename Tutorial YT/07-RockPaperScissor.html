<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Function</title>
</head>
<body>
<p>Function Rock Paper Scissors</p>
<button onclick="validateWinner('Rock')">
    Rock
</button>
<button onclick="validateWinner('Paper')">
    Paper
</button>

<button onclick="validateWinner('Scissors')">
    Scissors
</button>
    <script>
       function validateWinner(playerMove)
       {
            let computerMove = pickCompMove();
            const winningComb = 
            {
                'Scissors' : 
                {
                    'Rock' : 'You Lose.',
                    'Paper' : 'You Win.'
                },
                'Paper' : 
                {
                    'Scissors' : 'You Lose.',
                    'Rock' : 'You Win.'
                },
                'Rock' : 
                {
                    'Scissors' : 'You Win.',
                    'Paper' : 'You Lose.'
                }
            }
            let result = winningComb[playerMove][computerMove] || 'Tie';
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
        }
        function pickCompMove()
        {
            var randomNumber = Math.random();
            let computerMove = '';
            if(randomNumber >= 0 && randomNumber < 1/3)
            {
                computerMove = 'Rock'
            }
            else if(randomNumber >= 1/3 && randomNumber < 2/3)
            {
                computerMove = 'Paper'
            }
            else
            {
                computerMove = 'Scissors'
            }
            return computerMove;
        }
    </script>
</body>
</html>
