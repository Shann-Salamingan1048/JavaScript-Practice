<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Rock Paper Scissors Function</title>
    <link rel="stylesheet" href="12-rps.css">

</head>
<body>
<p class="title-p">Rock Paper Scissors</p>
<button class="move-button js-rock-btn"><img src="images/rock-emoji.png"
    class="move-icon">
    
</button>
<button  class="move-button js-paper-btn"> <img src="images/paper-emoji.png"
    class="move-icon">
    
</button>

<button  class="move-button js-scissors-btn"> <img src="images/scissors-emoji.png"
    class="move-icon">
    
</button>
<p class="js-result result-p">
</p>
<p class="js-moves">
</p>
<p class="js-score score-p">
</p>
<button  class="reset-btn js-reset-btn">
    Reset Score
</button>
<button  class="auto-play-btn js-auto-play-btn"> Auto Play</button>

<script src="12-rps.js"></script>
</body>
</html>
